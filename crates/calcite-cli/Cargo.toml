[package]
name = "calcite-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "calcite"
path = "src/main.rs"

[dependencies]
calcite-core = { path = "../calcite-core" }
calcite-rates = { path = "../calcite-rates", features = ["ecb", "frankfurter"] }
