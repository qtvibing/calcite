[package]
name = "calcite-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
tzdb = ["dep:calcite-tzdb"]

[dependencies]
calcite-core = { path = "../calcite-core", features = ["json"] }
calcite-tzdb = { path = "../calcite-tzdb", optional = true }
js-sys = "0.3"
serde_json.workspace = true
wasm-bindgen = "0.2"
