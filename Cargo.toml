[workspace]
members = [
    "crates/calcite-core",
    "crates/calcite-rates",
    "crates/calcite-tzdb",
    "crates/calcite-cli",
    "crates/calcite-wasm",
]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
dashu-float = "0.6.0"
dashu-int = "0.6.0"
dashu-ratio = "0.6.0"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.2"
jiff = "0.2.35"
quick-xml = "0.38.4"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
rustyline = { version = "18.0.1", default-features = false, features = ["with-file-history"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
